name: build-with-accelerator

# 仅在「上游 l429609201/dockerCopilot 真正更新」时才重新打包：
# 由 watch-upstream.yml 巡检发现上游 HEAD 变化后发 repository_dispatch(upstream-updated) 触发本流程；
# 也支持在 Actions 页面手动 Run workflow 立即构建。
#
# 补丁内容：
#   1. 用本仓库的 auth.go 覆盖上游同名文件 + 新增 hubcfg 包：检测只走镜像
#      自身声明的源站，不引入任何第三方加速站或兜底；hubURL 可填多个自建站
#      （逗号/分号/空格分隔），按主备顺序选第一个可达者，不轮询、不冲突；
#      健康探测用真实 manifest GET（library/nginx，5s 超时，校验 200+digest+JSON），
#      因为自建站 /v2/ 在上游回源卡死时仍秒回 200，只有 manifest 能识别上游超时；
#   2. 用 patch_checkupdate.py 修复 BuildManifestURL 的 scheme 拼接，并给
#      digest 获取加同 URL 重试（300/600/900ms 退避）；
#   3. 用 patch_scheduler.py 让定时检测始终执行（上游把检测绑死在 Telegram
#      开关上，未开 TG 时界面快照永不刷新：检不出新版 / 一直误报有更新）；
#   4. 用 patch_taskcenter.py 把任务中心「清除已完成」持久化到 localStorage，
#      避免刷新页面后 SSE 把后端仍保留的全量任务重新推回来；
#   5. 用 patch_cachelag.py 做「复查确认」：疑似有更新时先强制刷新自建站
#      manifest 缓存再重新取 digest，消除「刚更新完又提示」的误报；
#      不使用任何抑制状态，真更新不会被压掉；
#      另外识别「上游节点池长期缓存几天前旧 index（STALE）」：复查后仍不一致时
#      沿同一自建站链路取远端镜像 config 的 created，不晚于本地则判为旧缓存、
#      不报更新；远端构建时间取不到（403/429/超时，加速站数据不可信）同样不报，
#      60 秒后重试，不是永久抑制；确实更新则正常报出（hubStaleCheck=off 可关）；
#      取不到时同时调用 hubcfg.Invalidate() 让当前站选择立即失效，下一轮检测
#      就重新探测并切备站，不必等满 60 秒 TTL（30 秒内最多触发一次）；
#   6. 用 patch_pullviahub.py 让点「更新」时的镜像拉取也走同一个自建加速站，
#      含带显式域名的官方站镜像（避免 100 次/小时/IP 限流导致拉不动），
#      并在拉取前强制刷新该站 manifest 缓存；不碰宿主机 daemon 配置；
#   7. 用 patch_attribution.py 把镜像内维护者署名改为 po9873（原作者 onlyLTY · DongShu 署名保留）。
#
# Docker Hub 推送需要在仓库 Settings → Secrets → Actions 配置：
#   DOCKERHUB_USERNAME  Docker Hub 用户名
#   DOCKERHUB_TOKEN     Docker Hub 访问令牌（hub.docker.com → 账户设置 → Security → Personal access tokens）
# 未配置时自动跳过 Docker Hub，仅推 GHCR。
on:
  repository_dispatch:
    types: [upstream-updated]
  workflow_dispatch: # 支持在 Actions 页面手动点 Run workflow 立即构建
  push:
    branches: [main] # 补丁更新推送到 main 时自动重建（API dispatch 在部分网络下不可用）
    paths-ignore:
      # 镜像保活 workflow 的改动与镜像内容无关，不该触发重新打包：
      # 否则会生成新 digest，让三台 DC 在「没有新版本」时误报有更新。
      - .github/workflows/keep-images-alive.yml

concurrency:
  group: build-accel
  cancel-in-progress: true

env:
  UPSTREAM_REPO: l429609201/dockerCopilot
  UPSTREAM_BRANCH: main
  DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
  DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      # 1. 检出本仓库（根目录放着打好加速站补丁的 auth.go）
      - name: Checkout this repo (patch overlay)
        uses: actions/checkout@v4

      # 2. 检出上游 dockerCopilot 最新代码
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_BRANCH }}
          path: upstream

      # 3. 叠加补丁：直接覆盖上游同名文件。
      #    若上游重构了 internal/module/auth.go，编译会失败并邮件通知，
      #    把上游新版 auth.go 拿来重新套补丁更新本仓库文件即可。
      - name: Overlay accelerator patch
        run: |
          set -euo pipefail
          cp auth.go upstream/internal/module/auth.go
          # hubcfg 是独立包：hubURL 支持多个自建加速站（按配置顺序主备，
          # 同一时刻只用一个），检测 / 拉取 / 清缓存三处共用当前站。
          mkdir -p upstream/internal/hubcfg
          cp hubcfg.go upstream/internal/hubcfg/hubcfg.go

      # 3.2 同站重试补丁：在 checkupdate.go 的 GetDigest 失败分支插入
      #     同一 URL 重试逻辑（不依赖第三方加速站）。锚点未命中（上游
      #     重构）时脚本以非零码退出，构建失败并通知。
      - name: Overlay checkupdate retry patch
        run: |
          set -euo pipefail
          python3 patch_checkupdate.py

      # 3.3 定时检测解绑 Telegram：检测 + 容器状态刷新无条件执行，
      #     只有「推送通知」仍受 TG 开关控制。不引入代理/第三方依赖。
      - name: Overlay scheduler auto-check patch
        run: |
          set -euo pipefail
          python3 patch_scheduler.py

      # 3.4 任务中心清除记录持久化：后端无删除接口，前端 hidden Set
      #     改为写入 localStorage，刷新页面后已清除记录不再复活。
      - name: Overlay task center persistence patch
        run: |
          set -euo pipefail
          python3 patch_taskcenter.py

      # 3.5 加速站 manifest 缓存滞后复查 + 陈旧 index 识别：KSpeeder 等自建缓存
      #     TTL 不可调，缓存里的旧 digest 与本地镜像永远不相等，导致「更新完又提示」，
      #     上游节点池还可能长期返回几天前的旧 index（STALE）被误当成新版。
      #     疑似有更新时先 force=1 清该站缓存再重新 HEAD 一次；复查后仍不一致时
      #     取远端 manifest → config.created 与本地镜像构建时间比对，远端不晚于本地
      #     即判为旧缓存、不报更新；取不到信息则判为不可验证、同样不报更新。
      #     两种情况都把当前站冷却降权，下一轮自动改用 hubURL 里的下一站（冷却
      #     到期自动恢复），从根上避开「站活着但一直喂旧 index」。远端确实更新时
      #     保持原判定，真更新不压掉。30 秒内只清一次缓存，不依赖第三方、不碰代理。
      - name: Overlay cache-lag recheck patch
        run: |
          set -euo pipefail
          python3 patch_cachelag.py

      # 3.6 拉取链路改走自建加速站：上游 ImagePull 传原始镜像名，请求由宿主机
      #     daemon 直连 registry-1.docker.io，完全绕过 hubURL，导致"检测到更新
      #     却拉不动"。补丁把 Docker Hub 镜像改写为 hubURL 前缀、拉完 tag 回原名、
      #     再删掉临时引用（主备切换不累积 <站域名>/ 别名），并覆盖 DC 自更新的
      #     第二处 ImagePull；拉取前调用自建站 force=1 清缓存。
      - name: Overlay pull-via-hub patch
        run: |
          set -euo pipefail
          python3 patch_pullviahub.py

      # 3.7 署名补丁：把镜像内 DockerCopilot 的维护者身份从 l429609201
      #     改为 po9873（原作者 onlyLTY · DongShu 署名保留）。
      #     涉及侧边栏团队信息、镜像 LABEL、关于页链接、自身容器图标识别。
      #     上游结构变动导致匹配失败时构建会失败并提示更新脚本。
      - name: Overlay attribution patch
        run: |
          set -euo pipefail
          python3 patch_attribution.py

      - name: Prepare version info
        run: |
          set -euo pipefail
          # 版本号严格沿用上游 version 文件，不再附加 accel.N 后缀。
          # 加速站是构建补丁，不应改变 DockerCopilot 的程序版本号。
          BASE_VERSION=$(tr -d ' \n\r\t' < upstream/version)
          echo "VERSION=${BASE_VERSION}" >> $GITHUB_ENV
          echo "UPSTREAM_SHA=$(cd upstream && git rev-parse --short HEAD)" >> $GITHUB_ENV

      # 4. 只发布 latest，避免再产生带 accel 后缀的镜像标签
      - name: Compute image tags
        run: |
          set -euo pipefail
          TAGS="ghcr.io/${{ github.repository_owner }}/dockercopilot-accel:latest"
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            TAGS="${TAGS}"$'\n'"docker.io/${DH_USER}/dockercopilot:latest"
            echo "将同时推送到 Docker Hub: ${DH_USER}/dockercopilot:latest"
          else
            echo "未配置 DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secret，本次仅推送 GHCR"
          fi
          {
            echo 'TAGS<<EOF'
            echo "$TAGS"
            echo 'EOF'
          } >> $GITHUB_ENV

      # 5. 多架构构建（amd64 + arm64）。
      #    该 Dockerfile 的前端/Go 编译阶段固定在构建机原生架构交叉编译，
      #    只有运行时 alpine 阶段需要 QEMU，整体构建时间可控。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DH_USER != '' && env.DH_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAGS }}
          build-args: |
            VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ env.UPSTREAM_SHA }}
            org.opencontainers.image.source=https://github.com/${{ env.UPSTREAM_REPO }}
